# EducationHub CI: backend build + unit + integration (real SQL Server), admin build + unit.
# Mission Phase A. Runs on every push and pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      # Read by tests/EducationHub.Tests.Integration/SqlServerFixture.cs
      EducationHub__TestConnection: "Server=localhost,1433;User Id=sa;Password=CiOnly_Passw0rd!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EducationHub.sln

      - name: Build (warnings are errors)
        run: dotnet build EducationHub.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/EducationHub.Tests.Unit -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        run: dotnet test tests/EducationHub.Tests.Integration -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  admin:
    name: Admin SPA (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npx ng build

      - name: Unit tests (headless Chrome)
        run: npm run test:ci
